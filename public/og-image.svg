<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1030;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:0.1" />
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Glow orbs -->
  <ellipse cx="200" cy="150" rx="300" ry="200" fill="#7c3aed" opacity="0.15" filter="url(#blur)"/>
  <ellipse cx="1000" cy="480" rx="350" ry="220" fill="#2563eb" opacity="0.12" filter="url(#blur)"/>
  <ellipse cx="600" cy="315" rx="250" ry="180" fill="#a78bfa" opacity="0.06" filter="url(#blur)"/>

  <!-- Grid lines (subtle) -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <!-- Logo icon — stylised "C" with inner glow -->
  <circle cx="600" cy="205" r="52" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.9"/>
  <circle cx="600" cy="205" r="40" fill="url(#glow)"/>
  <text x="600" y="222" font-family="Georgia, serif" font-size="42" font-weight="bold"
        text-anchor="middle" fill="url(#accent)">C</text>

  <!-- Main title -->
  <text x="600" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="68" font-weight="700" letter-spacing="-1"
        text-anchor="middle" fill="#ffffff">
    Clarity Mode
  </text>

  <!-- Gradient underline -->
  <rect x="440" y="336" width="320" height="3" rx="2" fill="url(#accent)" opacity="0.8"/>

  <!-- Tagline -->
  <text x="600" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="28" font-weight="400" letter-spacing="0.5"
        text-anchor="middle" fill="#c4b5fd" opacity="0.9">
    Clear mind. Strong self. Focused life.
  </text>

  <!-- Feature pills -->
  <g>
    <!-- Pill 1 -->
    <rect x="270" y="450" width="180" height="44" rx="22" fill="#ffffff" opacity="0.08" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.4"/>
    <text x="360" y="478" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" text-anchor="middle" fill="#c4b5fd">AI Life Coach</text>

    <!-- Pill 2 -->
    <rect x="510" y="450" width="180" height="44" rx="22" fill="#ffffff" opacity="0.08" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.4"/>
    <text x="600" y="478" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" text-anchor="middle" fill="#c4b5fd">Diary RAG</text>

    <!-- Pill 3 -->
    <rect x="750" y="450" width="180" height="44" rx="22" fill="#ffffff" opacity="0.08" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.4"/>
    <text x="840" y="478" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" text-anchor="middle" fill="#c4b5fd">Growth Tracking</text>
  </g>

  <!-- Bottom URL -->
  <text x="600" y="580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="20" font-weight="400" letter-spacing="1"
        text-anchor="middle" fill="#6b7280" opacity="0.8">
    claritymode.com
  </text>
</svg>
