# ═══════════════════════════════════════════════════════════════════════════════
# Nixpacks Configuration for Railway Deployment
# ═══════════════════════════════════════════════════════════════════════════════
# Railway uses Nixpacks to auto-detect and build Python apps.
# This file provides additional instructions for system dependencies.

[nixpacks]
builder = "python"

[phases.setup]
nixPkgs = [
    "python311",          # Python 3.11
    "poppler_utils",      # PDF text extraction (pdf2image needs pdftoppm)
    "gcc",                # Required for some Python packages
    "gfortran",           # Required for numpy/scipy
    "libffi",             # Required for some Python packages
    "openssl",            # Required for httpx
]

# Install system deps via apt as well (Poppler for PDF processing)
[phases.install]
cmds = [
    "apt-get update && apt-get install -y --no-install-recommends poppler-utils && rm -rf /var/lib/apt/lists/*"
]

# Use pip for Python dependencies
[phases.build]
cmds = ["pip install --no-cache-dir -r requirements.txt"]

# ─── Startup ──────────────────────────────────────────────────────────────────
[start]
cmd = "sh start.sh"